<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --bg:#040810;--bg2:#070d1a;--bg3:#0b1120;--card:#111827;--bar:#0d1526;
  --border:rgba(255,255,255,.07);--ba:rgba(99,179,237,.38);
  --t1:#e8edf5;--t2:#7a8ba0;--t3:#3d4f63;
  --blue:#3b9eff;--cyan:#22d3ee;--green:#10b981;--purple:#8b5cf6;--red:#f87171;
  --gb:rgba(59,158,255,.15);
  --fn:'JetBrains Mono',monospace;--fd:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--fn)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--t3);border-radius:2px}
#app{display:flex;flex-direction:column;height:100vh}

/* Header */
#hd{height:40px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--fd);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.logo-box{width:20px;height:20px;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;box-shadow:0 0 10px rgba(59,158,255,.4)}
.sep{width:1px;height:18px;background:var(--border)}
.hd-sub{font-size:10px;color:var(--t2);letter-spacing:.12em}
.sp{flex:1}
#api-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3);padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:var(--card)}
#api-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0}
#api-badge.ok .dot{background:var(--green);box-shadow:0 0 5px var(--green)}
#api-badge.ok{color:var(--t2)}
#msel{background:var(--bg2);border:1px solid var(--border);color:var(--t1);font-family:var(--fn);font-size:10px;border-radius:5px;padding:2px 6px;outline:none;cursor:pointer}
#msel:focus{border-color:var(--ba)}
.back-btn{font-size:10px;color:var(--t3);display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.back-btn:hover{color:var(--t2);border-color:var(--ba)}

/* Tabs */
#tabbar{height:36px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;gap:2px;padding:0 8px;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px;height:28px;border-radius:6px 6px 0 0;font-size:11px;color:var(--t3);background:transparent;border:1px solid transparent;border-bottom:none;cursor:pointer;white-space:nowrap;transition:all .15s;min-width:130px;max-width:200px;user-select:none}
.tab.active{background:var(--bg3);color:var(--t1);border-color:var(--border);border-bottom-color:var(--bg3)}
.tab:hover:not(.active){background:rgba(255,255,255,.03);color:var(--t2)}
.tab-fav{width:13px;height:13px;border-radius:2px;flex-shrink:0}
.tab-lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.tab-x{width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t3);flex-shrink:0;opacity:0;transition:all .15s;background:transparent;border:none;cursor:pointer}
.tab:hover .tab-x,.tab.active .tab-x{opacity:1}
.tab-x:hover{background:rgba(248,113,113,.2);color:var(--red)}
.tab-plus{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--t3);cursor:pointer;background:transparent;border:none;font-size:15px;flex-shrink:0;margin-bottom:2px;transition:all .15s}
.tab-plus:hover{color:var(--t1);background:rgba(255,255,255,.05)}

/* Toolbar */
#tb{height:48px;background:var(--bar);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;padding:0 8px;flex-shrink:0}
.nb{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--t3);font-size:14px;cursor:pointer;transition:all .12s;flex-shrink:0}
.nb:hover{background:rgba(255,255,255,.06);color:var(--t1)}
.nb:active{transform:scale(.92)}
.nb:disabled{opacity:.28;cursor:not-allowed}
.nb.spin i{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#uw{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:8px;height:34px;padding:0 10px;gap:7px;transition:border-color .15s,box-shadow .15s;min-width:0}
#uw:focus-within{border-color:var(--ba);box-shadow:0 0 0 3px var(--gb)}
#u-lock{font-size:13px;color:var(--t3);flex-shrink:0}
#u-proto{font-size:11px;color:var(--green);flex-shrink:0;font-weight:600}
#u-inp{flex:1;background:transparent;border:none;outline:none;color:var(--t1);font-size:12px;font-family:var(--fn);min-width:0}
#u-inp::selection{background:rgba(59,158,255,.3)}
#u-go{width:26px;height:26px;border-radius:5px;background:var(--blue);border:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;cursor:pointer;flex-shrink:0;transition:all .12s}
#u-go:hover{background:#2563eb}
#u-go:active{transform:scale(.9)}
.tb-btn{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--t2);font-size:13px;cursor:pointer;transition:all .12s;flex-shrink:0}
.tb-btn:hover{background:rgba(255,255,255,.08);color:var(--t1)}
#mode-tag{font-size:9px;padding:2px 6px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--t3);white-space:nowrap}
#mode-tag.proxy{border-color:rgba(34,211,238,.35);color:var(--cyan)}
#mode-tag.direct{border-color:rgba(16,185,129,.35);color:var(--green)}
#mode-tag.ai{border-color:rgba(139,92,246,.35);color:var(--purple)}

/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#bpane{flex:1;position:relative;overflow:hidden;background:var(--bg);min-height:0}
#pbar{position:absolute;top:0;left:0;right:0;height:2px;z-index:20;pointer-events:none}
#pbar-fill{height:100%;width:0%;border-radius:1px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .2s;box-shadow:0 0 6px var(--cyan)}
#bframe{width:100%;height:100%;border:none;background:#fff;display:none;transition:opacity .2s}

/* Welcome */
#welcome{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;z-index:5;padding:40px}
.wlogo{font-family:var(--fd);font-size:30px;font-weight:800;letter-spacing:.04em}
.wlogo span{background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wsearch{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:50px;padding:0 18px;gap:10px;width:100%;max-width:540px;height:48px;transition:all .15s}
.wsearch:focus-within{border-color:var(--ba);box-shadow:0 0 0 3px var(--gb)}
#ws-inp{flex:1;background:transparent;border:none;outline:none;font-size:14px;color:var(--t1);font-family:var(--fn)}
#ws-btn{width:34px;height:34px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:all .12s;flex-shrink:0}
#ws-btn:hover{background:#2563eb;transform:scale(1.05)}
.qlinks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:540px}
.ql{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s;min-width:76px;color:var(--t2);font-size:10px;user-select:none}
.ql:hover{border-color:var(--ba);color:var(--t1);transform:translateY(-2px);background:var(--bg3)}
.ql-ic{font-size:20px}
.whint{font-size:10px;color:var(--t3);text-align:center;max-width:440px;line-height:1.8}

/* Blocked */
#blocked{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10}
#blocked.v{display:flex}
.bl-ic{font-size:44px;color:var(--t3)}
.bl-title{font-family:var(--fd);font-size:16px;color:var(--t2)}
.bl-desc{font-size:11px;color:var(--t3);text-align:center;max-width:370px;line-height:1.7}
.bl-acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bl-btn{padding:7px 16px;border-radius:8px;font-size:11px;cursor:pointer;border:1px solid var(--border);transition:all .15s;font-family:var(--fn);background:var(--card);color:var(--t2)}
.bl-btn:hover{color:var(--t1);border-color:var(--ba)}
.bl-btn.prim{background:var(--blue);color:#fff;border-color:transparent}
.bl-btn.prim:hover{background:#2563eb}

/* AI results view */
#ai-view{position:absolute;inset:0;display:none;background:#fff;overflow:auto;z-index:3;font-family:Arial,sans-serif;font-size:14px;color:#111;padding:24px 32px}
#ai-view.v{display:block}
#ai-view h1{font-size:20px;margin-bottom:12px;color:#1a1a2e;border-bottom:2px solid #3b9eff;padding-bottom:8px}
#ai-view .ai-badge{display:inline-block;background:#8b5cf6;color:#fff;font-size:10px;padding:2px 8px;border-radius:20px;margin-bottom:12px}
#ai-view .summary{color:#555;font-size:13px;line-height:1.7;margin-bottom:18px}
#ai-view .result{border:1px solid #e0e7ef;border-radius:8px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:all .15s}
#ai-view .result:hover{border-color:#3b9eff;background:#f0f7ff}
#ai-view .r-title{color:#1a73e8;font-size:15px;font-weight:bold;margin-bottom:3px}
#ai-view .r-url{color:#137333;font-size:11px;margin-bottom:5px;display:flex;align-items:center;gap:4px}
#ai-view .r-url img{width:14px;height:14px}
#ai-view .r-date{color:#888;font-size:10px}
#ai-view .r-desc{color:#444;font-size:13px;line-height:1.6}

/* Divider */
#div{height:5px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);cursor:ns-resize;flex-shrink:0;display:flex;align-items:center;justify-content:center}
#div::after{content:'';width:36px;height:2px;border-radius:1px;background:var(--t3);display:block;transition:all .15s}
#div:hover{background:var(--gb)}
#div:hover::after{background:var(--blue);width:52px}

/* AI Panel */
#aip{height:300px;background:var(--bg3);display:flex;flex-direction:column;flex-shrink:0;min-height:130px;max-height:70vh}
#ai-hd{height:34px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0;background:var(--bg)}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 5px var(--blue)}
.ai-lbl{font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t2)}
.ai-st{font-size:10px;color:var(--t3);margin-left:auto}
#ai-clr{font-size:10px;color:var(--t3);cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:transparent;transition:all .12s;font-family:var(--fn)}
#ai-clr:hover{color:var(--red);border-color:rgba(248,113,113,.3)}
#ai-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:7px;align-items:flex-start;animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.av{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px}
.msg.user .av{background:rgba(59,158,255,.2);color:var(--blue)}
.msg.ai .av{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(59,158,255,.3));color:var(--cyan)}
.msg.sys .av{background:rgba(34,211,238,.1);color:var(--cyan)}
.mb{flex:1;min-width:0}
.mr{font-size:9px;color:var(--t3);margin-bottom:2px;font-weight:600;letter-spacing:.08em}
.mt{font-size:11px;line-height:1.65;color:var(--t1);background:var(--card);border:1px solid var(--border);border-radius:4px 10px 10px 10px;padding:7px 11px;word-break:break-word}
.msg.user .mt{background:rgba(59,158,255,.1);border-color:rgba(59,158,255,.2);border-radius:10px 4px 10px 10px}
.msg.sys .mt{background:rgba(34,211,238,.05);border-color:rgba(34,211,238,.15);font-size:10px;color:var(--t2);border-radius:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(59,158,255,.15);border:1px solid rgba(59,158,255,.25);color:var(--blue);margin-top:4px;cursor:pointer;transition:all .12s}
.chip:hover{background:rgba(59,158,255,.25)}
.dots{display:flex;align-items:center;gap:4px;padding:9px 11px}
.d{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:dot 1.2s ease-in-out infinite}
.d:nth-child(2){animation-delay:.2s}.d:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}
#qps{display:flex;gap:4px;flex-wrap:wrap;padding:0 9px 5px}
.qp{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--t2);cursor:pointer;transition:all .12s}
.qp:hover{border-color:var(--ba);color:var(--t1);background:var(--gb)}
#ai-in{border-top:1px solid var(--border);padding:7px 9px;display:flex;gap:7px;align-items:flex-end;flex-shrink:0;background:var(--bg)}
#ai-ta{flex:1;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--t1);font-size:11px;font-family:var(--fn);outline:none;resize:none;max-height:90px;min-height:36px;line-height:1.5;transition:border-color .15s,box-shadow .15s}
#ai-ta:focus{border-color:var(--ba);box-shadow:0 0 0 3px var(--gb)}
#ai-ta::placeholder{color:var(--t3)}
#ai-send{width:36px;height:36px;border-radius:9px;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;transition:all .15s}
#ai-send:hover{background:#2563eb;transform:scale(1.05)}
#ai-send:active{transform:scale(.93)}
#ai-send.busy{background:var(--t3);cursor:not-allowed}
#ai-send.busy i{animation:spin .6s linear infinite}
#toasts{position:fixed;top:54px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{padding:9px 14px;border-radius:9px;background:var(--card);border:1px solid var(--border);font-size:11px;color:var(--t1);box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tIn .2s ease;max-width:300px}
@keyframes tIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.toast.ok{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.toast.err{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.toast.info{border-color:rgba(59,158,255,.4);background:rgba(59,158,255,.08)}
</style>
</head>
<body>
<div id="app">

<!-- Header -->
<div id="hd">
  <div class="logo"><div class="logo-box"><i class="ph-bold ph-infinity"></i></div>NOVA</div>
  <div class="sep"></div>
  <div class="hd-sub">BROWSER</div>
  <div class="sp"></div>
  <!-- ✅ Model list exactly matches index v4's option values -->
  <select id="msel" title="AI 模型">
    <option value="gemini-2.5-flash">⚡ Gemini 2.5 Flash</option>
    <option value="gemini-2.5-pro">🧠 Gemini 2.5 Pro</option>
    <option value="gemini-3-flash-preview">✨ Gemini 3.1 Flash Preview</option>
    <option value="gemini-3.1-pro-preview">🔬 Gemini 3.2 Pro Preview</option>
  </select>
  <div id="api-badge"><div class="dot"></div><span id="api-txt">未連線</span></div>
  <div class="back-btn" onclick="window.close()"><i class="ph-bold ph-arrow-left"></i> 返回</div>
</div>

<!-- Tabs -->
<div id="tabbar">
  <div id="tabs-c"></div>
  <button class="tab-plus" onclick="newTab()" title="新分頁"><i class="ph-bold ph-plus"></i></button>
</div>

<!-- Toolbar -->
<div id="tb">
  <button class="nb" id="btn-back" onclick="goBack()" disabled><i class="ph-bold ph-arrow-left"></i></button>
  <button class="nb" id="btn-fwd"  onclick="goFwd()"  disabled><i class="ph-bold ph-arrow-right"></i></button>
  <button class="nb" id="btn-ref"  onclick="doRefresh()"><i class="ph-bold ph-arrow-clockwise"></i></button>
  <button class="nb" onclick="goHome()"><i class="ph-bold ph-house"></i></button>
  <div id="uw">
    <i id="u-lock" class="ph-fill ph-lock-simple-open" style="color:var(--t3)"></i>
    <span id="u-proto"></span>
    <input id="u-inp" type="text" placeholder="輸入網址或搜尋…" autocomplete="off" spellcheck="false">
    <button id="u-go" onclick="navigate()"><i class="ph-bold ph-arrow-right"></i></button>
  </div>
  <span id="mode-tag">就緒</span>
  <button class="tb-btn" onclick="analyzeNow()" title="AI 分析頁面"><i class="ph-fill ph-robot"></i></button>
  <button class="tb-btn" onclick="openExt()" title="在新分頁開啟"><i class="ph-bold ph-arrow-square-out"></i></button>
</div>

<!-- Main Split -->
<div id="main">
  <div id="bpane">
    <div id="pbar"><div id="pbar-fill"></div></div>
    <iframe id="bframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>

    <!-- Welcome -->
    <div id="welcome">
      <div class="wlogo">NOVA <span>Browser</span></div>
      <div class="wsearch">
        <i class="ph-bold ph-magnifying-glass" style="color:var(--t3);font-size:15px;flex-shrink:0"></i>
        <input id="ws-inp" placeholder="搜尋或輸入網址…" autocomplete="off">
        <button id="ws-btn" onclick="wSearch()"><i class="ph-bold ph-arrow-right"></i></button>
      </div>
      <div class="qlinks">
        <div class="ql" onclick="loadProxy('https://tw.news.yahoo.com')"><span class="ql-ic">📰</span>Yahoo新聞</div>
        <div class="ql" onclick="loadProxy('https://news.ycombinator.com')"><span class="ql-ic">🟠</span>Hacker News</div>
        <div class="ql" onclick="loadProxy('https://zh.wikipedia.org')"><span class="ql-ic">📚</span>Wikipedia</div>
        <div class="ql" onclick="loadProxy('https://github.com/trending')"><span class="ql-ic">🐱</span>GitHub</div>
        <div class="ql" onclick="aiSearch('今日最新 AI 科技新聞')"><span class="ql-ic">🤖</span>AI新聞</div>
        <div class="ql" onclick="aiSearch('台灣股市今日行情')"><span class="ql-ic">📈</span>台股行情</div>
        <div class="ql" onclick="aiSearch('全球即時重大新聞今天')"><span class="ql-ic">🌐</span>即時新聞</div>
        <div class="ql" onclick="aiSearch('今日 Reddit 熱門討論')"><span class="ql-ic">🔥</span>熱門話題</div>
      </div>
      <p class="whint">在下方 AI 欄輸入指令：「搜尋 iPhone 16 評測」、「分析這個頁面」、「幫我找台灣最新新聞」</p>
    </div>

    <!-- Blocked -->
    <div id="blocked">
      <div class="bl-ic"><i class="ph-fill ph-shield-warning"></i></div>
      <div class="bl-title">無法載入此頁面</div>
      <div class="bl-desc" id="bl-desc">代理伺服器無法取得此頁面，或網站封鎖了外部存取。</div>
      <div class="bl-acts">
        <button class="bl-btn prim" onclick="openExt()"><i class="ph-bold ph-arrow-square-out"></i> 在新分頁開啟</button>
        <button class="bl-btn" onclick="aiSumPage()"><i class="ph-fill ph-robot"></i> AI 摘要此頁</button>
        <button class="bl-btn" onclick="goHome()">返回首頁</button>
      </div>
    </div>

    <!-- AI Search Results -->
    <div id="ai-view"></div>
  </div>

  <div id="div"></div>

  <div id="aip">
    <div id="ai-hd">
      <div class="ai-dot"></div>
      <div class="ai-lbl">NOVA AI 瀏覽助理</div>
      <div class="ai-st" id="ai-st">就緒</div>
      <button id="ai-clr" onclick="clearChat()">清除</button>
    </div>
    <div id="ai-msgs"></div>
    <div id="qps">
      <div class="qp" onclick="qp('搜尋今日最新科技新聞')">📰 今日新聞</div>
      <div class="qp" onclick="qp('分析並摘要目前頁面內容')">🔍 分析頁面</div>
      <div class="qp" onclick="qp('翻譯此頁面成繁體中文')">🌐 翻譯頁面</div>
      <div class="qp" onclick="qp('列出此頁面的重要連結')">🔗 關鍵連結</div>
    </div>
    <div id="ai-in">
      <textarea id="ai-ta" rows="1" placeholder="自然語言指令… 例：搜尋 GPT-5 新消息、幫我開啟 Wikipedia、分析這個頁面"></textarea>
      <button id="ai-send" onclick="sendMsg()"><i class="ph-bold ph-paper-plane-right"></i></button>
    </div>
  </div>
</div>
</div>
<div id="toasts"></div>

<script>
// ════════════════════════════════════════════════════════════
//  NOVA Browser  —  AI Engine & Navigation
//  API keys: shared with index.html via localStorage (nova_key_gemini)
//  Model names & API version: 100% identical to index v4/v5
// ════════════════════════════════════════════════════════════

// ─── Keys from same localStorage as index v4 ───────────────
const getKey = () => localStorage.getItem('nova_key_gemini') || '';

// ─── API version logic (exact copy from index v4 line 8607) ─
// v1alpha → preview / gemini-3 / thinking / research / computer
// v1beta  → everything else (gemini-2.5-flash, gemini-2.5-pro)
const apiVer = m =>
  (m.includes('preview') || m.includes('gemini-3') ||
   m.includes('thinking')|| m.includes('research') ||
   m.includes('computer')) ? 'v1alpha' : 'v1beta';

// ─── CORS proxy cascade ─────────────────────────────────────
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];

// ─── State ──────────────────────────────────────────────────
const S = {
  tabs:[], activeId:null,
  hist:{ stack:[], pos:-1 },
  busy:false, aiHistory:[],
  pageText:null, curUrl:null,
  dragging:false,
};
let _tid = 0;

// ════════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  checkKey(); setupUrlBar(); setupIframe(); setupDiv(); setupTa();
  newTab();
  addMsg('sys',`👋 你好！我是 NOVA 瀏覽助理。\n\n可以用自然語言告訴我：\n• 「搜尋 iPhone 16 最新消息」\n• 「幫我開啟 Wikipedia」\n• 「分析這個頁面的內容」\n\n⚠️ 部分網站（Google、YouTube）因安全政策無法在瀏覽器框架中顯示，AI 搜尋功能可完全繞過此限制。`);
  document.getElementById('ws-inp').addEventListener('keydown', e=>{ if(e.key==='Enter') wSearch(); });
});

function checkKey(){
  const k = getKey();
  const b = document.getElementById('api-badge');
  if(k){ b.classList.add('ok'); document.getElementById('api-txt').textContent='Gemini 已連線'; }
  else {
    document.getElementById('api-txt').textContent='API Key 未設定';
    addMsg('sys','⚠️ 未偵測到 Gemini API Key。請先在 NOVA 主程式的「設定」頁面填入後重開此視窗。');
  }
}

// ════════════════════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════════════════════
function newTab(url){
  const id='T'+(++_tid);
  S.tabs.push({id,url:url||null,title:'新分頁',fav:null});
  S.activeId=id; renderTabs();
  if(url) loadProxy(url); else showWelcome();
}
function switchTab(id){
  S.activeId=id; const t=S.tabs.find(x=>x.id===id); renderTabs();
  if(!t?.url) showWelcome();
}
function closeTab(id,e){
  e?.stopPropagation(); S.tabs=S.tabs.filter(t=>t.id!==id);
  if(!S.tabs.length){ newTab(); return; }
  if(S.activeId===id) S.activeId=S.tabs.at(-1).id;
  renderTabs();
}
function renderTabs(){
  const c=document.getElementById('tabs-c'); c.innerHTML='';
  S.tabs.forEach(t=>{
    const el=document.createElement('div');
    el.className='tab'+(t.id===S.activeId?' active':'');
    el.onclick=()=>switchTab(t.id);
    const ic=t.fav?`<img class="tab-fav" src="${t.fav}" onerror="this.style.display='none'">`
                  :`<i class="ph-fill ph-globe" style="font-size:12px;color:var(--t3);flex-shrink:0"></i>`;
    el.innerHTML=`${ic}<span class="tab-lbl">${esc(t.title)}</span><button class="tab-x" onclick="closeTab('${t.id}',event)"><i class="ph-bold ph-x"></i></button>`;
    c.appendChild(el);
  });
}
function tabSet(f,v){ const t=S.tabs.find(x=>x.id===S.activeId); if(t){t[f]=v; renderTabs();} }

// ════════════════════════════════════════════════════════════
//  URL BAR
// ════════════════════════════════════════════════════════════
function setUrlBar(url){
  const inp=document.getElementById('u-inp'), proto=document.getElementById('u-proto'), lock=document.getElementById('u-lock');
  if(!url){inp.value='';proto.textContent='';return;}
  if(url.startsWith('https://')){
    proto.textContent='https://'; inp.value=url.slice(8);
    lock.className='ph-fill ph-lock-simple'; lock.style.color='var(--green)';
  } else if(url.startsWith('http://')){
    proto.textContent='http://'; inp.value=url.slice(7);
    lock.className='ph-fill ph-lock-simple-open'; lock.style.color='var(--red)';
  } else { proto.textContent=''; inp.value=url; lock.className='ph-fill ph-lock-simple-open'; lock.style.color='var(--t3)'; }
}
function getBar(){ return document.getElementById('u-proto').textContent + document.getElementById('u-inp').value.trim(); }
function resolve(raw){
  raw=(raw||'').trim();
  if(!raw) return null;
  if(/^https?:\/\//i.test(raw)) return raw;
  if(/^[a-zA-Z0-9-]+(\.[a-zA-Z]{2,}){1,}(\/[^\s]*)?$/.test(raw)&&!raw.includes(' ')) return 'https://'+raw;
  return null;
}
function setupUrlBar(){
  const inp=document.getElementById('u-inp');
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') navigate(); });
  inp.addEventListener('focus', ()=>{ const f=getBar(); document.getElementById('u-proto').textContent=''; inp.value=f; inp.select(); });
  inp.addEventListener('blur', ()=>setUrlBar(getBar()));
}
function navigate(){
  const raw=getBar(); const url=resolve(raw);
  if(url) loadProxy(url); else aiSearch(raw);
}
function wSearch(){
  const v=document.getElementById('ws-inp').value.trim(); if(!v) return;
  const url=resolve(v);
  if(url) loadProxy(url); else aiSearch(v);
}

// ════════════════════════════════════════════════════════════
//  PROXY-BASED NAVIGATION  (fixes "拒絕連線")
//  Strategy: allorigins → corsproxy → direct iframe → blocked
// ════════════════════════════════════════════════════════════
async function loadProxy(url, push=true){
  if(!url) return;
  S.curUrl=url; S.pageText=null;
  setUrlBar(url); tabSet('url',url); tabSet('title',dom(url));
  tabSet('fav',`https://www.google.com/s2/favicons?domain=${dom(url)}&sz=32`);
  if(push) histPush(url);
  hideOverlays(); startProg(); setMode('proxy');

  // 1. Try proxy cascade
  const html = await fetchProxy(url);
  if(html){ renderSrcdoc(html,url); stopProg(); return; }

  // 2. Fallback: direct iframe (works for CORS-permissive sites)
  setMode('direct');
  const fr=document.getElementById('bframe');
  fr.style.opacity='0'; fr.style.display='block';
  fr.removeAttribute('srcdoc');
  fr.src=url;
  // load/error handled by setupIframe
}

async function fetchProxy(url){
  for(const fn of PROXIES){
    try{
      const res=await fetch(fn(url),{signal:AbortSignal.timeout(9000)});
      if(!res.ok) continue;
      const txt=await res.text();
      if(txt&&txt.length>300){
        // Extract plain text for AI
        const d=document.createElement('div');
        d.innerHTML=txt.replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<style[\s\S]*?<\/style>/gi,'');
        S.pageText=d.textContent.replace(/\s+/g,' ').trim().slice(0,15000);
        return txt;
      }
    } catch{}
  }
  return null;
}

function renderSrcdoc(html, baseUrl){
  // Inject <base> so relative assets resolve + intercept clicks
  const base=`<base href="${baseUrl}" target="_blank">`;
  const intercept=`<script>
    document.addEventListener('click',function(e){
      var a=e.target.closest('a');
      if(a&&a.href&&!a.href.startsWith('javascript')){
        e.preventDefault();
        window.parent.postMessage({type:'NOVA_NAV',url:a.href},'*');
      }
    },true);
    document.addEventListener('submit',function(e){
      e.preventDefault();
      var f=e.target,url=f.action||location.href;
      var q=new URLSearchParams(new FormData(f)).toString();
      if(q) url+=(url.includes('?')?'&':'?')+q;
      window.parent.postMessage({type:'NOVA_NAV',url:url},'*');
    },true);
  <\/script>`;
  let p=html;
  p=/<head>/i.test(p)?p.replace(/<head>/i,`<head>${base}`):`${base}${p}`;
  p=/<\/body>/i.test(p)?p.replace(/<\/body>/i,`${intercept}</body>`):p+intercept;
  const fr=document.getElementById('bframe');
  fr.style.display='block'; fr.style.opacity='1';
  fr.removeAttribute('src'); fr.srcdoc=p;
  hideOverlays();
}

// Capture navigation from proxy iframe
window.addEventListener('message',e=>{
  if(e.data?.type==='NOVA_NAV'&&e.data.url){
    const url=resolve(e.data.url)||e.data.url;
    loadProxy(url);
  }
});

function setupIframe(){
  const fr=document.getElementById('bframe');
  fr.addEventListener('load',()=>{
    stopProg(); fr.style.opacity='1';
    document.getElementById('blocked').classList.remove('v');
    try{ tabSet('title',fr.contentDocument?.title||dom(fr.src||'')); }catch{}
  });
  fr.addEventListener('error',()=>{ stopProg(); showBlocked('直接載入失敗：網站可能封鎖了外部連結或發生網路錯誤。'); });
}

// ─── History ────────────────────────────────────────────────
function histPush(url){ S.hist.stack=S.hist.stack.slice(0,S.hist.pos+1); S.hist.stack.push(url); S.hist.pos++; updNav(); }
function goBack(){ if(S.hist.pos>0){S.hist.pos--; loadProxy(S.hist.stack[S.hist.pos],false);} }
function goFwd(){ if(S.hist.pos<S.hist.stack.length-1){S.hist.pos++; loadProxy(S.hist.stack[S.hist.pos],false);} }
function doRefresh(){ if(S.curUrl&&!S.curUrl.startsWith('ai-')) loadProxy(S.curUrl,false); }
function goHome(){ S.curUrl=null; setUrlBar(''); hideOverlays(); document.getElementById('welcome').style.display='flex'; tabSet('title','新分頁'); tabSet('url',null); }
function updNav(){ document.getElementById('btn-back').disabled=S.hist.pos<=0; document.getElementById('btn-fwd').disabled=S.hist.pos>=S.hist.stack.length-1; }
function openExt(){ if(S.curUrl&&!S.curUrl.startsWith('ai-')) window.open(S.curUrl,'_blank'); }

// ─── Overlay helpers ────────────────────────────────────────
function hideOverlays(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('blocked').classList.remove('v');
  document.getElementById('ai-view').classList.remove('v');
  const fr=document.getElementById('bframe');
  fr.style.display='none'; fr.style.opacity='0';
}
function showWelcome(){ hideOverlays(); document.getElementById('welcome').style.display='flex'; }
function showBlocked(msg){ hideOverlays(); document.getElementById('blocked').classList.add('v'); document.getElementById('bl-desc').textContent=msg||''; }
function setMode(m){ const el=document.getElementById('mode-tag'); el.className=m; el.textContent=m==='proxy'?'🔄 Proxy':m==='direct'?'✅ Direct':m==='ai'?'🤖 AI':m; }

// ─── Progress bar ────────────────────────────────────────────
let _pt; function startProg(){ let w=0; const f=document.getElementById('pbar-fill'); f.style.width='0%'; clearInterval(_pt); _pt=setInterval(()=>{w=Math.min(w+Math.random()*9,90);f.style.width=w+'%';},200); }
function stopProg(){ clearInterval(_pt); const f=document.getElementById('pbar-fill'); f.style.width='100%'; setTimeout(()=>{f.style.width='0%';},400); }

// ════════════════════════════════════════════════════════════
//  GEMINI API  —  exact model names & version from index v4
// ════════════════════════════════════════════════════════════
async function callGemini(prompt, opts={}){
  const key=getKey();
  if(!key) throw new Error('API Key 未設定，請先在 NOVA 主程式設定頁填入 Gemini API Key。');

  // ✅ Use same model option values as index v4's <select id="gemini-sub-model-select">
  let model=document.getElementById('msel')?.value||'gemini-2.5-flash';
  // ✅ Same apiVersion logic as index v4 fetchAIResponse (line 8606-8609)
  let ver=apiVer(model);

  const contents=[
    ...S.aiHistory.slice(-10).map(h=>({role:h.role,parts:[{text:h.text}]})),
    {role:'user',parts:[{text:prompt}]}
  ];
  const payload={
    ...(opts.sys?{system_instruction:{parts:[{text:opts.sys}]}}:{}),
    contents,
    generationConfig:{temperature:0.5,maxOutputTokens:4096},
    ...(opts.search?{tools:[{google_search:{}}]}:{}),
  };

  let res=await fetch(
    `https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${key}`,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(60000)}
  );
  let data=await res.json();

  // ✅ Same 404 auto-fallback as index v4 lines 8665-8676
  if(!res.ok && data.error?.code===404 && (model.includes('preview')||model.includes('gemini-3'))){
    const fb=model.includes('pro')?'gemini-2.5-pro':'gemini-2.5-flash';
    toast(`模型 ${model} 不可用，自動切換至 ${fb}`,'info');
    model=fb; ver='v1beta';
    res=await fetch(
      `https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${key}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}
    );
    data=await res.json();
  }
  if(!res.ok) throw new Error(data.error?.message||`API 錯誤 ${res.status}`);
  return data.candidates?.[0]?.content?.parts?.filter(p=>p.text).map(p=>p.text).join('')||'';
}

// ── AI Search ────────────────────────────────────────────────
async function aiSearch(query){
  S.curUrl=`ai-search://${encodeURIComponent(query)}`;
  tabSet('title',`🔍 ${query}`); tabSet('url',null);
  document.getElementById('u-proto').textContent='';
  document.getElementById('u-inp').value=query;
  hideOverlays(); startProg(); setMode('ai');

  const today=new Date().toLocaleDateString('zh-TW');
  const sys=`你是 NOVA Browser 的 AI 搜尋引擎。今天日期：${today}。
只輸出 JSON（不要有任何前言或 markdown 代碼塊符號）：
{"title":"搜尋標題","summary":"2~3句摘要","results":[{"title":"","url":"https://...","desc":"","date":""}]}
results 最多 6 筆，URL 必須是真實的知名網站，優先提供最新資料（${today}前後）。`;
  try{
    const raw=await callGemini(query,{sys,search:true});
    const clean=raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    let parsed; try{parsed=JSON.parse(clean);}catch{parsed=null;}
    stopProg(); renderResults(parsed,query,raw);
  }catch(e){ stopProg(); showBlocked(`AI 搜尋失敗：${e.message}`); }
}

function renderResults(data,query,raw){
  const v=document.getElementById('ai-view');
  if(!data?.results){
    v.innerHTML=`<h1>🤖 搜尋：${esc(query)}</h1><div class="ai-badge">AI 生成</div><p style="color:#444;line-height:1.8;white-space:pre-wrap">${esc(raw)}</p>`;
  } else {
    const rows=data.results.map(r=>{
      let h='example.com'; try{h=new URL(r.url||'https://example.com').hostname;}catch{}
      return `<div class="result" onclick="loadProxy('${esc(r.url||'')}')">
        <div class="r-title">${esc(r.title)}</div>
        <div class="r-url"><img src="https://www.google.com/s2/favicons?domain=${h}&sz=16">${esc(r.url||'')}${r.date?` <span class="r-date">· ${esc(r.date)}</span>`:''}</div>
        <div class="r-desc">${esc(r.desc||'')}</div>
      </div>`;
    }).join('');
    v.innerHTML=`<h1>🔍 ${esc(data.title||query)}</h1><div class="ai-badge">✨ AI 智能搜尋</div><p class="summary">${esc(data.summary||'')}</p>${rows}`;
  }
  setMode('ai'); v.classList.add('v');
  document.getElementById('bframe').style.display='none';
  S.pageText=`搜尋：${query}\n${data?.summary||raw}`;
}

// ── Command processing ────────────────────────────────────────
async function processCmd(txt){
  const key=getKey();
  if(!key){addMsg('sys','⚠️ 請先在 NOVA 設定頁填入 Gemini API Key。');return;}
  S.busy=true; setBusy(true);
  const th=addThinking(); document.getElementById('ai-st').textContent='思考中…';
  const today=new Date().toLocaleDateString('zh-TW');
  const pCtx=S.pageText?`\n\n【目前頁面內容（節錄）】:\n${S.pageText.slice(0,5000)}`:'';
  const sys=`你是 NOVA Browser 的 AI 瀏覽助理。今天日期：${today}。
目前網址：${S.curUrl||'新分頁'}${pCtx}

只輸出 JSON（無前言、無 markdown 代碼塊）：
{"action":"navigate"|"search"|"analyze"|"answer","url":"(navigate時的完整https://網址)","query":"(search時的搜尋詞)","message":"給使用者的回覆（繁體中文）","followup":"(選填)後續建議"}

action 說明：
- navigate → 前往具體網址（例：「開啟 GitHub」→ url: https://github.com）
- search   → AI 智能搜尋（例：「搜尋 iPhone 16 評測」）
- analyze  → 分析/摘要/翻譯目前頁面
- answer   → 直接回答，不需導航`;
  try{
    const raw=await callGemini(txt,{sys,search:false});
    const clean=raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    let p; try{p=JSON.parse(clean);}catch{p={action:'answer',message:raw};}
    th.remove(); await execAction(p,txt);
  }catch(e){ th.remove(); addMsg('ai',`⚠️ 發生錯誤：${e.message}`); }
  finally{ S.busy=false; setBusy(false); document.getElementById('ai-st').textContent='就緒'; S.aiHistory.push({role:'user',text:txt}); }
}

async function execAction(p,orig){
  switch(p.action){
    case 'navigate':{
      const url=p.url||resolve(orig);
      if(!url){addMsg('ai',p.message||'找不到目標網址。');return;}
      const chip=`<br><br><span class="chip" onclick="loadProxy('${esc(url)}')"><i class="ph-bold ph-arrow-square-out"></i> 開啟 ${esc(dom(url))}</span>`;
      addMsg('ai',(p.message||`正在前往 \`${url}\``)+'\n▶ 已載入',chip);
      S.aiHistory.push({role:'model',text:p.message||''}); loadProxy(url); break;
    }
    case 'search':{
      const q=p.query||orig;
      addMsg('ai',p.message||`正在搜尋「${q}」…`);
      S.aiHistory.push({role:'model',text:p.message||''}); await aiSearch(q); break;
    }
    case 'analyze':{
      if(!S.pageText&&S.curUrl&&!S.curUrl.startsWith('ai-')){
        addMsg('sys','正在擷取頁面內容…'); await fetchProxy(S.curUrl);
      }
      if(!S.pageText){
        addMsg('ai','⚠️ 無法擷取此頁面的文字（可能是 JS 動態渲染或存取限制）。\n\n請讓我直接搜尋相關資料，或描述您的需求。');
        S.aiHistory.push({role:'model',text:'無法擷取頁面'}); return;
      }
      setBusy(true); const at=addThinking();
      try{
        const ans=await callGemini(`請完成任務：「${orig}」\n\n頁面內容：\n${S.pageText.slice(0,8000)}`,
          {sys:`你是 NOVA 頁面分析 AI。今天日期：${new Date().toLocaleDateString('zh-TW')}。用繁體中文回覆，善用 Markdown。`});
        at.remove(); addMsg('ai',ans); S.aiHistory.push({role:'model',text:ans});
      }catch(e2){at.remove();addMsg('ai',`分析失敗：${e2.message}`);}
      finally{setBusy(false);} break;
    }
    default:{
      const ans=p.message||'（無回應）';
      addMsg('ai',ans+(p.followup?`\n\n💡 ${p.followup}`:''));
      S.aiHistory.push({role:'model',text:p.message||''});
    }
  }
}

function analyzeNow(){ qp('請幫我深度分析並摘要目前頁面的所有重要資訊'); }
function aiSumPage(){ qp('請摘要這個頁面的主要內容並條列重點'); }

// ════════════════════════════════════════════════════════════
//  CHAT UI
// ════════════════════════════════════════════════════════════
function addMsg(role,text,extra=''){
  const c=document.getElementById('ai-msgs'), d=document.createElement('div');
  d.className=`msg ${role}`;
  const icons={user:'ph-user',ai:'ph-robot',sys:'ph-info'};
  const labels={user:'你',ai:'NOVA AI',sys:'系統'};
  const fmt=text.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code style="background:rgba(255,255,255,.07);padding:1px 4px;border-radius:3px;font-family:var(--fn)">$1</code>');
  d.innerHTML=`<div class="av"><i class="ph-fill ${icons[role]||'ph-info'}"></i></div><div class="mb"><div class="mr">${labels[role]||role}</div><div class="mt">${fmt}${extra}</div></div>`;
  c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
}
function addThinking(){
  const c=document.getElementById('ai-msgs'), d=document.createElement('div');
  d.className='msg ai';
  d.innerHTML=`<div class="av"><i class="ph-fill ph-robot"></i></div><div class="mb"><div class="mr">NOVA AI</div><div class="mt"><div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div></div></div></div>`;
  c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
}
function clearChat(){ S.aiHistory=[]; S.pageText=null; document.getElementById('ai-msgs').innerHTML=''; addMsg('sys','對話已清除。有什麼我可以幫你的嗎？'); }
function qp(t){ document.getElementById('ai-ta').value=t; sendMsg(); }
async function sendMsg(){
  if(S.busy) return;
  const ta=document.getElementById('ai-ta'), t=ta.value.trim(); if(!t) return;
  ta.value=''; ta.style.height='auto'; addMsg('user',t); await processCmd(t);
}
function setBusy(v){ const b=document.getElementById('ai-send'); b.classList.toggle('busy',v); b.innerHTML=v?'<i class="ph-bold ph-spinner"></i>':'<i class="ph-bold ph-paper-plane-right"></i>'; }
function setupTa(){
  const ta=document.getElementById('ai-ta');
  ta.addEventListener('input',()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,90)+'px'; });
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();} });
}

// ════════════════════════════════════════════════════════════
//  DIVIDER DRAG
// ════════════════════════════════════════════════════════════
function setupDiv(){
  const dv=document.getElementById('div'), aip=document.getElementById('aip');
  let sy=0,sh=0;
  dv.addEventListener('mousedown',e=>{S.dragging=true;sy=e.clientY;sh=aip.offsetHeight;document.body.style.cursor='ns-resize';document.body.style.userSelect='none';e.preventDefault();});
  document.addEventListener('mousemove',e=>{ if(!S.dragging) return; const h=Math.max(130,Math.min(window.innerHeight*.72,sh+(sy-e.clientY))); aip.style.height=h+'px'; });
  document.addEventListener('mouseup',()=>{ if(S.dragging){S.dragging=false;document.body.style.cursor='';document.body.style.userSelect='';} });
}

// ════════════════════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════════════════════
function dom(u){ try{return new URL(u).hostname.replace('www.','');}catch{return u;} }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type='info',ms=3000){
  const a=document.getElementById('toasts'), el=document.createElement('div');
  el.className=`toast ${type}`; el.textContent=msg; a.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},ms);
}
</script>
